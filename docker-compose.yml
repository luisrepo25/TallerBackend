services:
  web:
    build: .
    # --nothreading: un solo hilo para que la conexion a Supabase (DB_CONN_MAX_AGE) se
    # reutilice entre peticiones. Las peticiones se atienden una tras otra, pero cada una
    # tarda milisegundos en vez de ~1.8 s. Solo para desarrollo.
    command: python manage.py runserver 0.0.0.0:8000 --nothreading
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
